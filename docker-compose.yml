name: ormas-pro

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-ormas}
      MARIADB_USER: ${DB_USER:-ormas}
      MARIADB_PASSWORD: ${DB_PASSWORD:-ormas}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-ormas-root}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Installs the theme's Composer dependencies (Carbon Fields) into the bind mount.
  composer:
    image: composer:2
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /app
    volumes:
      - .:/app
    command: >-
      sh -lc 'if [ ! -d vendor ] || [ composer.lock -nt vendor/autoload.php ]; then
      composer install --no-dev --optimize-autoloader --no-interaction;
      else echo "Composer dependencies are up to date"; fi'
    restart: "no"

  wordpress:
    image: wordpress:php8.2-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      composer:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${WP_PORT:-8083}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-ormas}
      WORDPRESS_DB_USER: ${DB_USER:-ormas}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-ormas}
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('SCRIPT_DEBUG', true);
        define('DISALLOW_FILE_EDIT', false);
        define('FS_METHOD', 'direct');
        define('SMTP_HOST', 'mailpit');
        define('SMTP_PORT', 1025);
        define('SMTP_USERNAME', 'dev@ormas.local');
        define('SMTP_PASSWORD', '');
        define('SMTP_AUTH', false);
        define('SMTP_SECURE', '');
        define('SMTP_FROM_NAME', 'ORMAS Dev');
        define('SMTP_IS_HTML', true);
        define('SMTP_TO_EMAIL', 'dev@ormas.local');
        define('SMARTCAPTCHA_SERVER_KEY', '');
    volumes:
      - wordpress_data:/var/www/html
      - .:/var/www/html/wp-content/themes/ormas-pro
      - ./docker/php/dev.ini:/usr/local/etc/php/conf.d/dev.ini:ro

  # One-shot container: installs WordPress, activates the theme and demo pages.
  wp-init:
    image: wordpress:cli-php8.2
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      composer:
        condition: service_completed_successfully
      wordpress:
        condition: service_started
    user: "33:33"
    working_dir: /var/www/html
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-ormas}
      WORDPRESS_DB_USER: ${DB_USER:-ormas}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-ormas}
      WP_URL: ${WP_URL:-http://localhost:8083}
      WP_TITLE: ${WP_TITLE:-ORMAS Local}
      WP_ADMIN_USER: ${WP_ADMIN_USER:-admin}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:-admin}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:-admin@example.com}
    volumes:
      - wordpress_data:/var/www/html
      - .:/var/www/html/wp-content/themes/ormas-pro
      - ./docker/wp-init.sh:/usr/local/bin/wp-init.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/wp-init.sh"]

  wp-cli:
    image: wordpress:cli-php8.2
    profiles: ["tools"]
    user: "33:33"
    working_dir: /var/www/html
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-ormas}
      WORDPRESS_DB_USER: ${DB_USER:-ormas}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-ormas}
    entrypoint: ["wp"]
    volumes:
      - wordpress_data:/var/www/html
      - .:/var/www/html/wp-content/themes/ormas-pro

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8026}:8025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  db_data:
  wordpress_data:
